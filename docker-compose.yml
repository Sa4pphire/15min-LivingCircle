services:
  frontend:
    image: ${FRONTEND_IMAGE:-vct-frontend:local}
    build:
      context: ./frontend
      args:
        VITE_BAIDU_BROWSER_AK: ${VITE_BAIDU_BROWSER_AK:-}
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://backend:8000}
    ports:
      - "127.0.0.1:${LOCAL_PORT:-8000}:80"
    # No depends_on: a frontend release does not restart/start the backend.
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-vct-backend:local}
    build:
      context: .
      args:
        WITH_MYSQL: ${WITH_MYSQL:-false}
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      # Paired with the frontend's loopback-only published port.
      LOCAL_CONTAINER_EDITOR: "true"
      ANALYSIS_CACHE_DIR: /app/data/cache
      CPP_ENGINE_PATH: /app/bin/isochrone_engine
      CPP_ENGINE_TRANSPORT: subprocess
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
