name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Build C++ engine (Debug and Release)
        run: |
          cmake -S cpp-engine -B cpp-engine/build/debug -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=OFF
          cmake --build cpp-engine/build/debug --parallel
          ./cpp-engine/build/debug/isochrone_engine --health
          cmake -S cpp-engine -B cpp-engine/build/release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build cpp-engine/build/release --parallel
          ./cpp-engine/build/release/isochrone_engine --health

      - name: Check Python syntax
        run: python -m compileall -q backend/app backend/scripts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build container
        run: docker build -t fifteen-minute-life-circle:ci .
