name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Build and test C++ engine (Debug and Release)
        run: |
          cmake -S cpp-engine -B cpp-engine/build/debug -DCMAKE_BUILD_TYPE=Debug
          cmake --build cpp-engine/build/debug --parallel
          ctest --test-dir cpp-engine/build/debug --output-on-failure
          cmake -S cpp-engine -B cpp-engine/build/release -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp-engine/build/release --parallel
          ctest --test-dir cpp-engine/build/release --output-on-failure

      - name: Test Python API and C++ contract
        env:
          CPP_ENGINE_PATH: cpp-engine/build/release/isochrone_engine
        run: pytest backend/tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build container
        run: docker build -t fifteen-minute-life-circle:ci .
